<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kural Koşusu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kural Koşusu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0620">
<meta name="description" content="Kaydır, kurala uyan kapıyı seç. Beynini çalıştıran hızlı bir oyun.">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{background:#0a0620;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #top{position:fixed;top:0;left:0;right:0;padding:max(env(safe-area-inset-top),10px) 14px 0;pointer-events:none}
  #row1{display:flex;justify-content:space-between;align-items:center}
  #hearts{font-size:22px;letter-spacing:3px;min-width:90px}
  #score{font-size:30px;font-weight:900;text-align:center}
  #streak{min-width:90px;text-align:right;font-size:15px;font-weight:800;color:#ffd36b}
  #snd{pointer-events:auto;position:fixed;right:10px;bottom:10px;background:none;border:0;color:#fff;font-size:20px;opacity:.7}
  #banner{margin:8px auto 0;max-width:460px;text-align:center;padding:8px 12px 7px;border-radius:16px;background:rgba(255,255,255,.1);border:2px solid var(--ac,#fff);
    box-shadow:0 0 24px var(--ac,#fff);transition:box-shadow .2s}
  #banner b{display:block;font-size:clamp(22px,7vw,34px);font-weight:900;letter-spacing:2px;color:var(--ac,#fff);text-shadow:0 0 12px var(--ac,#fff);line-height:1.1}
  #banner span{font-size:12px;letter-spacing:2px;opacity:.8}
  #banner.chg{animation:chg .5s}
  @keyframes chg{0%{transform:scale(1.35) rotate(-2deg);filter:brightness(2)}100%{transform:none;filter:none}}
  .screen{position:fixed;inset:0;background:rgba(8,5,26,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
  .screen h1{margin:0;font-size:38px;font-weight:900;letter-spacing:3px;background:linear-gradient(#fff,#ff6bd6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .screen p{margin:0;max-width:340px;font-size:15px;line-height:1.5;opacity:.88}
  .screen button{font:inherit;font-weight:800;font-size:18px;letter-spacing:2px;color:#1a0f3d;background:linear-gradient(#ffe08a,#ffb347);border:0;border-radius:999px;padding:13px 0;width:230px;margin-top:4px}
  .screen button.alt{background:linear-gradient(#b7a8ff,#7c3aed);color:#fff}
  .screen button.alt2{background:linear-gradient(#ff8fa3,#e0245e);color:#fff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div id="row1"><div><div id="hearts">❤❤❤</div><div id="wx" style="font-size:12px;opacity:.9;letter-spacing:1px;margin-top:2px"></div></div><div id="score">0</div><div id="streak"></div></div>
  <div id="banner"><b id="bt">HAZIR OL</b><span id="bs">&nbsp;</span></div>
</div>
<button id="snd">🔊</button>

<div class="screen" id="start" style="display:flex">
  <h1>KURAL KOŞUSU</h1>
  <p>Üstteki <b>kurala</b> uyan kapıya doğru <b>kaydır</b> (veya ekranın sol/sağ yanına dokun).<br>Kural birkaç kapıda bir <b>değişir</b>, dikkat!</p>
  <button data-m="0">RAHAT</button>
  <button class="alt" data-m="1">NORMAL</button>
  <button class="alt2" data-m="2">ZORLU</button>
</div>
<div class="screen" id="over">
  <h1>BİTTİ!</h1>
  <p id="overTxt"></p>
  <button id="again">TEKRAR</button>
</div>

<script>
/*LOGIC*/
const CN=[{n:'KIRMIZI',c:'#ff4d6d'},{n:'MAVİ',c:'#3b9cff'},{n:'YEŞİL',c:'#3ddc84'},{n:'SARI',c:'#ffd23f'}];
const SHAPES=['daire','üçgen','kare'];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function evalRow(rule,items){ // doğru olan indeksler (bağımsız doğrulayıcı)
  const idx=[];
  if(rule.type==='big'){const m=Math.max(...items.map(i=>i.v));items.forEach((it,i)=>{if(it.v===m)idx.push(i)})}
  else if(rule.type==='small'){const m=Math.min(...items.map(i=>i.v));items.forEach((it,i)=>{if(it.v===m)idx.push(i)})}
  else if(rule.type==='even')items.forEach((it,i)=>{if(it.v%2===0)idx.push(i)});
  else if(rule.type==='odd')items.forEach((it,i)=>{if(it.v%2===1)idx.push(i)});
  else if(rule.type==='eq')items.forEach((it,i)=>{if(it.v===rule.param)idx.push(i)});
  else if(rule.type==='color')items.forEach((it,i)=>{if(it.col===rule.param)idx.push(i)});
  else if(rule.type==='shape')items.forEach((it,i)=>{if(it.shape===rule.param)idx.push(i)});
  else if(rule.type==='stroop')items.forEach((it,i)=>{if(it.ink===rule.param)idx.push(i)});
  return idx;
}
function expr(v){
  const ops=shuffle(['+','+','-','x']);
  for(const op of ops){
    if(op==='+'&&v>=2){const a=ri(1,v-1);return {text:a+'+'+(v-a),v}}
    if(op==='-'){const b=ri(1,9),a=v+b;return {text:a+'−'+b,v}}
    if(op==='x'){const ds=[];for(let d=2;d<=9;d++)if(v%d===0&&v/d>=2&&v/d<=9)ds.push(d);if(ds.length){const d=pick(ds);return {text:d+'×'+(v/d),v}}}
  }
  return {text:v+'+0',v};
}
const GEN={
  big(rule,hard){const hi=hard?99:40;const s=new Set();while(s.size<3)s.add(ri(1,hi));return [...s].map(v=>({t:'num',v,text:String(v)}))},
  small(rule,hard){return GEN.big(rule,hard)},
  even(rule,hard){const hi=hard?98:40;const out=[{t:'num',v:ri(1,hi/2)*2}];while(out.length<3){const v=ri(0,hi/2-1)*2+1;if(!out.some(o=>o.v===v))out.push({t:'num',v})}out.forEach(o=>o.text=String(o.v));return shuffle(out)},
  odd(rule,hard){const hi=hard?98:40;const out=[{t:'num',v:ri(0,hi/2-1)*2+1}];while(out.length<3){const v=ri(1,hi/2)*2;if(!out.some(o=>o.v===v))out.push({t:'num',v})}out.forEach(o=>o.text=String(o.v));return shuffle(out)},
  eq(rule){
    const T=rule.param,vals=new Set([T]);
    while(vals.size<3){const d=ri(1,4)*(Math.random()<.5?-1:1);const v=T+d;if(v>=2)vals.add(v)}
    return shuffle([...vals].map(v=>({t:'expr',...expr(v)})));
  },
  color(rule){
    const others=shuffle(CN.map(c=>c.n).filter(n=>n!==rule.param));
    const cols=shuffle([rule.param,others[0],others[1]]);
    return cols.map(c=>({t:'shape',shape:pick(SHAPES),col:c}));
  },
  shape(rule){
    const others=SHAPES.filter(s=>s!==rule.param);
    const shapes=shuffle([rule.param,pick(others),pick(others)]);
    const cols=shuffle(CN.map(c=>c.n)).slice(0,3);
    return shapes.map((s,i)=>({t:'shape',shape:s,col:cols[i]}));
  },
  stroop(rule){
    const names=CN.map(c=>c.n),T=rule.param;
    const notT=names.filter(n=>n!==T);
    const a={t:'word',word:pick(notT),ink:T};                // doğru: boya = hedef, yazı farklı
    const trap={t:'word',word:T,ink:pick(notT)};              // tuzak: yazı = hedef, boya farklı
    const inkB=pick(notT.filter(n=>n!==trap.ink)),wB=pick(notT);
    const b={t:'word',word:wB,ink:inkB};
    return shuffle([a,trap,b]);
  }
};
function newRule(prevType,n){
  const easy=['big','small','even','odd','shape','color'];
  let pool=easy.slice();
  if(n>=10)pool.push('eq','eq');
  if(n>=18)pool.push('stroop','stroop','eq');
  pool=pool.filter(t=>t!==prevType);
  const type=pick(pool),r={type,param:null,label:'',sub:'',accent:'#ffffff'};
  if(type==='big'){r.label='EN BÜYÜK';r.sub='en büyük sayıyı seç';r.accent='#ffd23f'}
  if(type==='small'){r.label='EN KÜÇÜK';r.sub='en küçük sayıyı seç';r.accent='#3ddc84'}
  if(type==='even'){r.label='ÇİFT SAYI';r.sub='2, 4, 6, 8 ile biten';r.accent='#3b9cff'}
  if(type==='odd'){r.label='TEK SAYI';r.sub='1, 3, 5, 7, 9 ile biten';r.accent='#ff8fa3'}
  if(type==='eq'){r.param=n>=30?ri(14,40):ri(6,22);r.label='SONUCU '+r.param+' OLAN';r.sub='işlemi çöz';r.accent='#b7a8ff'}
  if(type==='color'){const c=pick(CN);r.param=c.n;r.label=c.n+' OLAN';r.sub='bu renkteki şekli seç';r.accent=c.c}
  if(type==='shape'){r.param=pick(SHAPES);r.label=r.param.toUpperCase().replace('I','İ').replace('DAİRE','DAİRE');r.sub='bu şekli seç';r.accent='#ffffff'}
  if(type==='stroop'){const c=pick(CN);r.param=c.n;r.label='BOYA RENGİ: '+c.n;r.sub='kelimeye değil, boyaya bak!';r.accent=c.c}
  return r;
}
function makeRow(rule,n){
  const hard=n>=20;
  const items=GEN[rule.type](rule,hard);
  const good=evalRow(rule,items);
  return {items,correct:good[0],ok:good.length===1};
}
function worldFor(n){const idx=Math.floor(n/22);return idx===0?0:[1,2,3,4][(idx-1)%4]}
/*ENDLOGIC*/

// ============ GÖRÜNÜM / OYUN ============
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,HOR=0,PL=0,RB=0;
const MODES=[{name:'RAHAT',speed:.62,pw:.6},{name:'NORMAL',speed:.85,pw:1},{name:'ZORLU',speed:1.15,pw:1.2}];
let mode=MODES[1],state='menu';
let rows,lane,px,lives,score,streak,bestStreak,rowsSpawned,rowsDone,rowsOk,rule,periodLeft,prevType,time,shake,flash,flashCol,parts,popups,lastBannerRule;
let sound=true;try{sound=localStorage.getItem('kuralSnd')!=='0'}catch(e){}
const FW=(()=>{try{const v=new URLSearchParams(location.search).get('dunya');return v==null?null:Math.max(0,Math.min(4,+v||0))}catch(e){return null}})();
const WORLDS=[
 {name:'GECE',ic:'🌙',sky:['#0a0620','#3a1670'],road:['#2d1a6e','#1a0f45'],ground:['#1a0f45','#080418'],edge:'#78c8ff',rain:0,snow:0,fog:0,vis:0,ice:0,drops:0,storm:0,tip:''},
 {name:'YAĞMUR',ic:'☔',sky:['#050d18','#1f4466'],road:['#1d3250','#0c1828'],ground:['#0c1828','#04080f'],edge:'#8cc8ff',rain:1,snow:0,fog:.15,vis:.08,ice:0,drops:1,storm:0,tip:'damlalar yazıları bozuyor'},
 {name:'KAR',ic:'❄️',sky:['#33415e','#b5c4dc'],road:['#8d9bb6','#566380'],ground:['#d4dcec','#7685a0'],edge:'#ffffff',rain:0,snow:1,fog:.25,vis:.22,ice:.32,drops:0,storm:0,tip:'yol buz! şerit değişimi yavaş'},
 {name:'SİS',ic:'🌫️',sky:['#2c2c3c','#7a7a96'],road:['#44445e','#25252f'],ground:['#25252f','#12121a'],edge:'#c8c8e0',rain:0,snow:0,fog:1,vis:.36,ice:0,drops:0,storm:0,tip:'kapılar geç görünüyor'},
 {name:'FIRTINA',ic:'⛈️',sky:['#040410','#2c1a52'],road:['#1b1b3c','#090919'],ground:['#090919','#030309'],edge:'#9a8cff',rain:1.7,snow:0,fog:.2,vis:.1,ice:0,drops:1,storm:1,tip:'şimşek çakınca görüş kapanır'},
];
let pending=null,tempo=1,tempoT=1,graceUntil=0;
const ANN=['','YAĞMUR BAŞLADI!','KAR YAĞIYOR!','SİS ÇÖKTÜ!','FIRTINA!'];
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb=(c,a)=>a==null?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';
function themeOf(w){return {sky:w.sky.map(hx),road:w.road.map(hx),ground:w.ground.map(hx),edge:hx(w.edge),rain:w.rain,snow:w.snow,fog:w.fog,vis:w.vis,ice:w.ice,drops:w.drops,storm:w.storm}}
function lerpTheme(a,b,k){
  const lc=(x,y)=>x.map((v,i)=>v+(y[i]-v)*k);
  for(const key of ['sky','road','ground'])a[key]=a[key].map((c,i)=>lc(c,b[key][i]));
  a.edge=lc(a.edge,b.edge);
  for(const key of ['rain','snow','fog','vis','ice','drops','storm'])a[key]+=(b[key]-a[key])*k;
}
let th=themeOf(WORLDS[FW||0]),curWorld=null,rainP=[],snowP=[],lockUntil=0,blankUntil=0,boltIn=3,bolt=null,lightFlash=0;
function initWeather(){
  rainP=Array.from({length:170},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:12+Math.random()*18,v:750+Math.random()*500}));
  snowP=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:1.5+Math.random()*3,v:50+Math.random()*80,ph:Math.random()*6.28}));
}

function layout(){
  W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;
  HOR=Math.max(170,H*.26);PL=H*.8;RB=Math.min(W*.5,280);
}
addEventListener('resize',layout);

let ac=null;
function tone(f,d,type='sine',v=.12,to=null,delay=0){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

function reset(){
  rows=[];lane=1;px=1;lives=3;score=0;streak=0;bestStreak=0;rowsSpawned=0;rowsDone=0;rowsOk=0;
  rule=null;periodLeft=0;prevType=null;time=0;shake=0;flash=0;parts=[];popups=[];lastBannerRule=null;
  pending=null;tempo=1;tempoT=1;graceUntil=0;curWorld=null;th=themeOf(WORLDS[FW||0]);lockUntil=0;blankUntil=0;boltIn=3;bolt=null;lightFlash=0;initWeather();document.getElementById('wx').textContent='';
  document.getElementById('bt').textContent='HAZIR OL';document.getElementById('bs').innerHTML='&nbsp;';
  hud();
}
function hud(){
  document.getElementById('hearts').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak>=3?'🔥 '+streak+(streak>=5?' x'+(1+Math.floor(streak/5)):''):'';
}
function spawnRow(z0){
  if(periodLeft<=0){
    rule=pending||newRule(prevType,rowsSpawned);pending=null;prevType=rule.type;
    periodLeft=(rowsSpawned>=14?3:4)+ri(0,3);
  }
  periodLeft--;
  let r;do{r=makeRow(rule,rowsSpawned)}while(!r.ok);
  const dr=r.items.map(()=>Array.from({length:7},()=>({x:Math.random()*.9-.45,y:Math.random()*.8-.4,r:.04+Math.random()*.08})).concat([{x:Math.random()*.6-.3,y:Math.random()*.5-.25,r:.2+Math.random()*.08,smear:true}]));
  rows.push({z:z0||0,rule,world:FW!=null?FW:worldFor(rowsSpawned),dr,items:r.items,correct:r.correct,status:null,chosen:-1,t0:0});
  rowsSpawned++;
}
function setBanner(r){
  const b=document.getElementById('banner');
  document.getElementById('bt').textContent=r.label;document.getElementById('bs').textContent=r.sub;
  b.style.setProperty('--ac',r.accent);
  b.classList.remove('chg');void b.offsetWidth;b.classList.add('chg');
}
function update(dt){
  if(state!=='play')return;
  time+=dt;
  tempo+=(tempoT-tempo)*Math.min(1,dt*3);
  const sp=.3*mode.speed*tempo*(1+Math.min(.7,rowsDone*.013));
  rows.forEach(r=>r.z+=dt*sp);
  const last=rows[rows.length-1];
  if(periodLeft<=0&&!pending)pending=newRule(prevType,rowsSpawned);
  let gap=Math.max(.34,.58-rowsSpawned*.004);
  if(periodLeft<=0){gap+=.28;if(pending.type==='eq')gap+=.12;else if(pending.type==='stroop')gap+=.06}  // kural değişiminde nefes payı
  else if(rule&&rule.type==='eq')gap+=.14;                                                              // işlem satırları daha seyrek
  else if(rule&&rule.type==='stroop')gap+=.08;
  if(!last||last.z>=gap)spawnRow(0);
  px+=(lane-px)*Math.min(1,dt*(16-9*Math.min(1,th.ice*3)));
  lerpTheme(th,themeOf(WORLDS[curWorld==null?(FW||0):curWorld]),Math.min(1,dt*1.5));
  if(th.storm>.5&&state==='play'){
    boltIn-=dt;
    if(boltIn<=0){boltIn=3+Math.random()*4;bolt={x:W*(.15+.7*Math.random()),t0:performance.now()};lightFlash=.9;blankUntil=performance.now()+190;shake=Math.max(shake,12);
      tone(70,.8,'sawtooth',.2,30);tone(48,1,'square',.1,24,.12);buzz(80)}
  }
  // banner: önüne gelen ilk çözülmemiş satırın kuralı
  const near=rows.filter(r=>r.status===null).sort((a,b)=>b.z-a.z)[0];
  if(near&&near.world!==curWorld){
    const first=curWorld===null;curWorld=near.world;const w=WORLDS[curWorld];
    document.getElementById('wx').textContent=w.ic+' '+w.name;
    if(!first&&curWorld!==0){
      tone(200,.5,'sawtooth',.08,800);flash=.3;flashCol='#9ec8ff';
      popup(w.ic+' '+ANN[curWorld],W/2,H*.5,32,'#fff','#7ad0ff',1500,30);
      popup(w.tip,W/2,H*.58,18,'#fff','#c0d8ff',1700,20);
    }else if(!first){popup('🌙 HAVA AÇTI',W/2,H*.5,30,'#fff','#ffd36b',1200,30)}
  }
  if(near&&near.rule!==lastBannerRule){
    const first=lastBannerRule===null;lastBannerRule=near.rule;setBanner(near.rule);
    if(!first)graceUntil=time+1.8;
    if(!first){tone(300,.25,'sawtooth',.06,900);flash=.25;flashCol=near.rule.accent;popup('KURAL DEĞİŞTİ!',W/2,H*.5,34,'#fff','#ff6bd6',900,30)}
  }
  tempoT=1;
  if(near){const ty=near.rule.type;tempoT=ty==='eq'?.74:ty==='stroop'?.84:1}
  if(time<graceUntil)tempoT=Math.min(tempoT,.7);
  for(const r of rows){
    if(r.status===null&&r.z>=1){
      r.status=(lane===r.correct)?'ok':'bad';r.chosen=lane;r.t0=performance.now();rowsDone++;
      const x=laneX(lane,1);
      if(r.status==='ok'){
        rowsOk++;streak++;bestStreak=Math.max(bestStreak,streak);
        const pts=10*(1+Math.floor(streak/5));score+=pts;
        tone(440*Math.pow(2,Math.min(streak,12)/12),.18,'sine',.15);tone(660*Math.pow(2,Math.min(streak,12)/12),.22,'triangle',.08,null,.05);
        burst(x,PL,'#7dffb0',14);popup('+'+pts,x,PL-50,28+Math.min(16,streak),'#fff','#7dffb0',700,70);
        if(streak%5===0){flash=.3;flashCol='#ffd36b';popup('SERİ '+streak+'!',W/2,H*.45,46,'#fff','#ffb347',1000,40,-.06);buzz(60)}
        if(streak%10===0&&lives<3){lives++;popup('+❤',W/2,H*.35,40,'#fff','#ff6b8a',900,40)}
      }else{
        lives--;streak=0;shake=22;flash=.4;flashCol='#ff2d55';tone(130,.35,'sawtooth',.14,50);buzz(180);
        burst(x,PL,'#ff4d6d',18);popup('✗',x,PL-50,44,'#fff','#ff4d6d',700,60);
      }
      hud();
      if(lives<=0){state='over';setTimeout(showOver,700)}
    }
  }
  rows=rows.filter(r=>r.z<1.35);
}
function showOver(){
  const acc=rowsDone?Math.round(rowsOk/rowsDone*100):0;
  document.getElementById('overTxt').innerHTML='Puan: <b>'+score+'</b><br>Geçilen kapı: '+rowsDone+' · Doğru: %'+acc+'<br>En uzun seri: '+bestStreak;
  document.getElementById('over').style.display='flex';
}
// perspektif
const zp=z=>Math.pow(Math.max(0,z),1.7);
const zy=z=>HOR+(PL-HOR)*zp(z);
const zs=z=>.18+.82*zp(z);
const laneW=s=>2*RB*s/3;
const laneX=(l,z)=>W/2+(l-1)*laneW(zs(z));
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=120+Math.random()*300;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-150,life:.5+Math.random()*.4,col:i%3?col:'#fff',s:3+Math.random()*5})}}
function popup(text,x,y,size,c1,c2,life,rise,rot){popups.push({text,x,y,size,c1,c2,life,rise,rot:rot||0,t0:performance.now()})}

function drawShape(shape,x,y,r,col){
  ctx.save();ctx.translate(x,y);ctx.beginPath();
  if(shape==='daire')ctx.arc(0,0,r,0,7);
  else if(shape==='üçgen'){ctx.moveTo(0,-r*1.1);ctx.lineTo(r*1.05,r*.85);ctx.lineTo(-r*1.05,r*.85);ctx.closePath()}
  else ctx.roundRect(-r*.9,-r*.9,r*1.8,r*1.8,r*.3);
  const c=CN.find(c=>c.n===col).c;
  ctx.shadowColor=c;ctx.shadowBlur=r*.6;ctx.fillStyle=c;ctx.fill();ctx.shadowBlur=0;
  ctx.lineWidth=Math.max(1.5,r*.1);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-r*.3,-r*.4,r*.3,r*.15,-.5,0,7);ctx.fill();
  ctx.restore();
}
function drawTile(it,x,y,w,h,ring,drops,amt){
  ctx.save();ctx.translate(x,y);
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'rgba(60,50,120,.95)');g.addColorStop(1,'rgba(25,18,70,.95)');
  ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,h*.2);ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=Math.max(2,w*.03);ctx.strokeStyle=ring||'rgba(255,255,255,.4)';
  if(ring){ctx.shadowColor=ring;ctx.shadowBlur=w*.25}
  ctx.stroke();ctx.shadowBlur=0;
  if(it.t==='shape')drawShape(it.shape,0,0,h*.32,it.col);
  else{
    ctx.textAlign='center';ctx.textBaseline='middle';
    let fs=it.t==='word'?h*.3:(it.t==='expr'?h*.42:h*.55);
    ctx.font='900 '+fs+'px system-ui,-apple-system,sans-serif';
    const wd=ctx.measureText(it.text||it.word).width;if(wd>w*.88){fs*=w*.88/wd;ctx.font='900 '+fs+'px system-ui,-apple-system,sans-serif'}
    if(it.t==='word'){const c=CN.find(c=>c.n===it.ink).c;ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=fs*.4;ctx.fillText(it.word,0,0)}
    else{ctx.fillStyle='#fff';ctx.fillText(it.text,0,0)}
  }
  if(drops&&amt>.05){
    for(const d of drops){
      if(d.smear){const g2=ctx.createRadialGradient(d.x*w,d.y*h,0,d.x*w,d.y*h,d.r*w);g2.addColorStop(0,'rgba(210,235,255,'+(.5*amt)+')');g2.addColorStop(1,'rgba(210,235,255,0)');ctx.fillStyle=g2;ctx.beginPath();ctx.arc(d.x*w,d.y*h,d.r*w,0,7);ctx.fill()}
      else{ctx.fillStyle='rgba(200,230,255,'+(.35*amt)+')';ctx.beginPath();ctx.arc(d.x*w,d.y*h,d.r*w,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,'+(.6*amt)+')';ctx.beginPath();ctx.arc(d.x*w-d.r*w*.3,d.y*h-d.r*w*.3,d.r*w*.3,0,7);ctx.fill()}
    }
  }
  ctx.restore();
}
function draw(now,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  // gökyüzü
  const sky=ctx.createLinearGradient(0,0,0,HOR);sky.addColorStop(0,rgb(th.sky[0]));sky.addColorStop(1,rgb(th.sky[1]));
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,HOR);
  const gnd=ctx.createLinearGradient(0,HOR,0,H);gnd.addColorStop(0,rgb(th.ground[0]));gnd.addColorStop(1,rgb(th.ground[1]));
  ctx.fillStyle=gnd;ctx.fillRect(0,HOR,W,H-HOR);
  ctx.save();
  shake*=.86;if(shake<.2)shake=0;
  if(shake)ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  // yol
  const zb=1.45;
  ctx.beginPath();ctx.moveTo(W/2-RB*zs(0),HOR);ctx.lineTo(W/2+RB*zs(0),HOR);ctx.lineTo(W/2+RB*zs(zb),zy(zb));ctx.lineTo(W/2-RB*zs(zb),zy(zb));ctx.closePath();
  const rg=ctx.createLinearGradient(0,HOR,0,H);rg.addColorStop(0,rgb(th.road[0]));rg.addColorStop(1,rgb(th.road[1]));ctx.fillStyle=rg;ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=rgb(th.edge,.6);ctx.shadowColor=rgb(th.edge);ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;
  // şerit çizgileri (akan)
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;
  for(const k of [-1,1]){
    for(let i=0;i<14;i++){
      const z=((i+(time*mode.speed*1.6)%1)/14);const z2=z+0.03;
      const x1=W/2+k*RB*zs(z)/3,x2=W/2+k*RB*zs(z2)/3;
      ctx.lineWidth=Math.max(1,2*zs(z)*1.5);
      ctx.beginPath();ctx.moveTo(x1,zy(z));ctx.lineTo(x2,zy(z2));ctx.stroke();
    }
  }
  // satırlar (uzaktan yakına)
  const sorted=rows.slice().sort((a,b)=>a.z-b.z);
  for(const r of sorted){
    const s=zs(r.z),y=zy(r.z),w=laneW(s)*.8,h=w*.8;
    const vis=th.vis*mode.pw;
    let alpha=r.status?Math.max(0,1-(performance.now()-r.t0)/500):Math.min(1,Math.max(0,(r.z-vis)/.2));
    if(performance.now()<blankUntil)alpha*=.1;
    ctx.globalAlpha=alpha;
    r.items.forEach((it,i)=>{
      let ring=null;
      if(r.status){
        if(i===r.chosen)ring=r.status==='ok'?'#7dffb0':'#ff4d6d';
        else if(r.status==='bad'&&i===r.correct)ring='#7dffb0';
      }
      drawTile(it,laneX(i,r.z),y,w,h,ring,r.dr[i],Math.min(1,th.drops*mode.pw));
    });
    ctx.globalAlpha=1;
  }
  // sis
  if(th.fog>.02){
    const fa=Math.min(1,th.fog)*.8,fg=ctx.createLinearGradient(0,HOR-20,0,HOR+(PL-HOR)*.8);
    fg.addColorStop(0,rgb([200,200,225],fa));fg.addColorStop(1,rgb([200,200,225],0));
    ctx.fillStyle=fg;ctx.fillRect(0,HOR-20,W,(PL-HOR)*.8+20);
  }
  // oyuncu
  const pxs=W/2+(px-1)*laneW(1),py=PL+8;
  const R=laneW(1)*.2;
  const fever=streak>=5;
  const pg=ctx.createRadialGradient(pxs,py,0,pxs,py,R*3);
  pg.addColorStop(0,fever?'rgba(255,211,107,.9)':'rgba(120,220,255,.85)');pg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(pxs,py,R*3,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.shadowColor=fever?'#ffd36b':'#5ac8ff';ctx.shadowBlur=22;
  ctx.beginPath();ctx.arc(pxs,py+Math.sin(time*14)*2,R,0,7);ctx.fill();ctx.shadowBlur=0;
  // hava
  if(th.rain>.03){
    const n=Math.floor(rainP.length*Math.min(1,th.rain));
    ctx.strokeStyle='rgba(190,220,255,'+Math.min(.45,.3*th.rain)+')';ctx.lineWidth=1.3;ctx.beginPath();
    for(let i=0;i<n;i++){const p=rainP[i];p.y+=p.v*dt;p.x-=p.v*.12*dt;if(p.y>H){p.y=-20;p.x=Math.random()*W*1.2}ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.l*.12,p.y+p.l)}
    ctx.stroke();
  }
  if(th.snow>.03){
    const n=Math.floor(snowP.length*Math.min(1,th.snow));
    ctx.fillStyle='rgba(255,255,255,.88)';
    for(let i=0;i<n;i++){const p=snowP[i];p.y+=p.v*dt;p.ph+=dt*1.5;p.x+=Math.sin(p.ph)*20*dt;if(p.y>H){p.y=-10;p.x=Math.random()*W}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  }
  if(bolt){
    const age=(now-bolt.t0);
    if(age<260){
      ctx.save();ctx.strokeStyle='rgba(255,255,255,'+(1-age/260)+')';ctx.shadowColor='#bcd';ctx.shadowBlur=18;ctx.lineWidth=3;ctx.beginPath();
      let bx=bolt.x,by=0;ctx.moveTo(bx,by);
      const seed=bolt.t0;let k=0;while(by<HOR+40){k++;bx+=Math.sin(seed+k*7.3)*28;by+=34;ctx.lineTo(bx,by)}
      ctx.stroke();ctx.restore();
    }else bolt=null;
  }
  // parçacıklar
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2.5));ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  ctx.globalAlpha=1;
  ctx.restore();
  if(lightFlash>0){ctx.fillStyle='#fff';ctx.globalAlpha=Math.min(.85,lightFlash);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;lightFlash*=.85;if(lightFlash<.02)lightFlash=0}
  if(flash>0){ctx.fillStyle=flashCol;ctx.globalAlpha=Math.min(.3,flash);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;flash*=.9;if(flash<.01)flash=0}
  popups=popups.filter(p=>now-p.t0<p.life);
  for(const p of popups){
    const age=(now-p.t0)/p.life,e=Math.min(1,age*5),sc=p.size*(1+.6*(1-e*e)),yy=p.y-age*p.rise;
    ctx.save();ctx.globalAlpha=age>.7?1-(age-.7)/.3:1;ctx.translate(p.x,yy);ctx.rotate(p.rot);
    ctx.font='900 italic '+sc+'px system-ui,-apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=sc*.14;ctx.strokeStyle='#2a0a4a';ctx.strokeText(p.text,0,0);
    const gr=ctx.createLinearGradient(0,-sc/2,0,sc/2);gr.addColorStop(0,p.c1);gr.addColorStop(1,p.c2);ctx.fillStyle=gr;ctx.fillText(p.text,0,0);ctx.restore();
  }
}
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  update(dt);draw(now,dt);requestAnimationFrame(loop);
}
// girdi
function move(d){
  if(state!=='play')return;
  const nl=Math.max(0,Math.min(2,lane+d));
  if(nl===lane)return;
  const now=performance.now(),ice=th.ice*mode.pw;
  if(ice>.05&&now<lockUntil){tone(900,.05,'square',.03);return}
  lane=nl;lockUntil=now+ice*1000;tone(260,.08,'triangle',.06,420);
}
let sx=0,sy=0,tracking=false,moved=false;
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;tracking=true;moved=false});
addEventListener('pointermove',e=>{
  if(!tracking||moved)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>=24&&Math.abs(dx)>Math.abs(dy)){moved=true;move(dx>0?1:-1);sx=e.clientX;moved=false}
});
addEventListener('pointerup',e=>{
  if(tracking&&!moved&&Math.abs(e.clientX-sx)<12&&Math.abs(e.clientY-sy)<12&&state==='play'&&!e.target.closest('button')){move(e.clientX<W/2?-1:1)}
  tracking=false;
});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});
function begin(m){
  mode=MODES[m];document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';
  reset();state='play';tone(400,.2,'triangle',.1,800);spawnRow(.25);
}
document.querySelectorAll('#start button').forEach(b=>b.onclick=()=>begin(+b.dataset.m));
document.getElementById('again').onclick=()=>{document.getElementById('over').style.display='none';document.getElementById('start').style.display='flex';state='menu'};
const sndBtn=document.getElementById('snd');sndBtn.textContent=sound?'🔊':'🔇';
sndBtn.onclick=()=>{sound=!sound;sndBtn.textContent=sound?'🔊':'🔇';try{localStorage.setItem('kuralSnd',sound?'1':'0')}catch(e){}};
layout();reset();requestAnimationFrame(loop);
</script>
